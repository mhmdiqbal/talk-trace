sonar.projectKey=record-app
sonar.projectName=TalkTrace
# sonar.projectVersion is passed by scripts/sonar.sh, read from package.json.

sonar.host.url=http://localhost:9000

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Git-ignored paths are already skipped, but the SCM sensor is not guaranteed to
# run, and node_modules plus release are 787M between them. native/vendor is the
# whisper.cpp checkout: third-party code we do not own and will never fix.
sonar.exclusions=node_modules/**,dist/**,release/**,resources/**,native/**/.build/**,native/vendor/**,.ruff_cache/**

sonar.typescript.tsconfigPaths=tsconfig.json,tsconfig.renderer.json
