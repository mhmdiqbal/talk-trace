appId: com.mmdiqbal.recorder
productName: Recorder
copyright: Muhamad Iqbal

afterPack: build/afterPack.cjs

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: resources/RecorderHelper
    to: RecorderHelper
  - from: resources/RecorderTranscriber
    to: RecorderTranscriber
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: resources/trayRecording.png
    to: trayRecording.png
  - from: resources/trayRecording@2x.png
    to: trayRecording@2x.png

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dir
      arch: arm64
  identity: "Apple Development: Muhamad Iqbal (2KL7MN2RPU)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSScreenCaptureUsageDescription: >-
      Recorder needs Screen Recording access to capture the sound your Mac
      plays. No picture is ever captured or saved.
    NSMicrophoneUsageDescription: >-
      Recorder needs the microphone so your voice is mixed into the recording.
