appId: com.mmdiqbal.talktrace
productName: TalkTrace
copyright: Muhamad Iqbal

afterPack: build/afterPack.cjs

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - package.json

extraResources:
  - from: resources/TalkTraceHelper
    to: TalkTraceHelper
  - from: resources/TalkTraceTranscriber
    to: TalkTraceTranscriber
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: resources/trayRecording.png
    to: trayRecording.png
  - from: resources/trayRecording@2x.png
    to: trayRecording@2x.png

mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  target:
    - target: dir
      arch: arm64
    - target: dmg
      arch: arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    LSUIElement: true
    NSScreenCaptureUsageDescription: >-
      TalkTrace needs Screen Recording access to capture the sound your Mac
      plays. No picture is ever captured or saved.
    NSMicrophoneUsageDescription: >-
      TalkTrace needs the microphone so your voice is mixed into the recording.

dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  window:
    width: 540
    height: 380
  iconSize: 128
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications
